<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>추상의 네 장면 — 쇼케이스</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#060708;--line:#202328;--ink:#ece9e2;--mute:#8d8a84;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:24px 16px 60px}
.wrap{max-width:1400px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{margin:0;font-family:"Nanum Myeongjo","Batang",serif;font-size:clamp(24px,3.4vw,36px)}
.eyebrow{font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.14em;color:var(--mute)}
header a{color:var(--mute);font-size:13px}
.live{width:100%;aspect-ratio:16/10;border:1px solid var(--line);background:#000}
.live iframe{width:100%;height:100%;border:0;display:block}
h2{font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.14em;color:var(--mute);font-weight:400;margin:34px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:18px}
.work{border:1px solid var(--line)}
.work video{width:100%;aspect-ratio:16/9;display:block;background:#000;object-fit:cover}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px 6px}
.meta b{font-family:"Nanum Myeongjo","Batang",serif;font-size:19px;font-weight:700}
.meta span{color:var(--mute);font-size:12px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 4px 4px}
.acts figure{margin:0;position:relative}
.acts img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.acts figcaption{position:absolute;left:6px;bottom:4px;font-family:ui-monospace,Consolas,monospace;font-size:10px;color:#fff;text-shadow:0 0 6px #000}
.empty{color:var(--mute);border:1px dashed var(--line);padding:24px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="eyebrow">MEDIA-ART · SHOWCASE</div><h1>추상의 네 장면</h1></div>
    <a href="/">팀 갤러리 →</a>
  </header>

  <div class="live"><iframe src="/files/index.html" title="실제 작품 — 마우스가 손입니다"></iframe></div>

  <h2>네 작품 · 2막 미리보기와 1·2·3막</h2>
  <div class="grid" id="grid"></div>
</div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
fetch('/api/items').then((r) => r.json()).then(({ official }) => {
  const renders = official.filter((i) => i.id.startsWith('render-'));
  const grid = document.getElementById('grid');
  if (!renders.length) { grid.innerHTML = '<div class="empty">아직 렌더가 없습니다. <code>npm run media:render</code></div>'; return; }
  grid.innerHTML = renders.map((it) => {
    const f = (n) => it.files.find((x) => x.name === n)?.url;
    const video = f('preview.mp4') || it.files.find((x) => x.kind === 'video')?.url;
    const acts = ['act1.jpg', 'act2.jpg', 'act3.jpg'].map((n, k) => f(n) ? `<figure><img src="${esc(f(n))}" alt="${k + 1}막" loading="lazy"><figcaption>${k + 1}막</figcaption></figure>` : '').join('');
    return `<article class="work">
      ${video ? `<video src="${esc(video)}" autoplay muted loop playsinline></video>` : `<img src="${esc(it.preview)}" alt="">`}
      <div class="meta"><b>${esc(it.title.replace(' — 렌더', ''))}</b><span>${esc(it.theme)}</span></div>
      <div class="acts">${acts}</div>
    </article>`;
  }).join('');
});
</script>
</body>
</html>
