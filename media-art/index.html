function space(){let count=0,a0,r0,tilt,ecc,rate,tier;return {key:'space',init(){count=Math.min(450,Math.round(W*H/1950));a0=new Float32Array(count);r0=new Float32Array(count);tilt=new Float32Array(count);ecc=new Float32Array(count);rate=new Float32Array(count);tier=new Uint8Array(count);for(let i=0;i<count;i++){a0[i]=rand(i,1)*TAU;r0[i]=H*(.11+.48*Math.sqrt(rand(i,2)));tilt[i]=(rand(i,3)-.5)*2.3;ecc[i]=.22+.72*rand(i,4);rate[i]=(.25+.72*rand(i,5))*(H/r0[i])*.36;tier[i]=i%3}},seek(){},step(dt,time,hands){clear();let birth=smooth(2,10,time),orbit=smooth(12,21,time),close=smooth(36,47,time),paths=[new Path2D(),new Path2D(),new Path2D()],cores=new Path2D();for(let i=0;i<count;i++){let r=r0[i]*(.02+.98*birth)*(1-close),ang=a0[i]+time*rate[i]*(1+close*3),ct=Math.cos(tilt[i]),st=Math.sin(tilt[i]),curve=paths[tier[i]],segments=orbit>0?6:2;for(let j=segments;j>=0;j--){let a=ang-j*(.025+.02*tier[i])*orbit,R=r*(1-j*.004),ox=Math.cos(a)*R,oy=Math.sin(a)*R*ecc[i],x=W*.5+ox*ct-oy*st,y=H*.5+ox*st+oy*ct;let radial=1-orbit;if(radial>0){x=W*.5+(x-W*.5)*(1+radial*.15*j);y=H*.5+(y-H*.5)*(1+radial*.15*j)}for(let h of hands){let p=handPower(h,x,y,.19),speed=clamp(h.speed/700,0,1);x+=(h.x-x)*p*.42+Math.cos(a+1.5)*speed*p*48;y+=(h.y-y)*p*.42+Math.sin(a+1.5)*speed*p*48;if(h.dwell>1&&p>.3){x=h.x+Math.cos(a+time*2)*r*.12;y=h.y+Math.sin(a+time*2)*r*.12}}if(j===segments)curve.moveTo(x,y);else curve.lineTo(x,y);if(j===0&&i%9===0){cores.moveTo(x+1.5,y);cores.arc(x,y,1.3,0,TAU)}}}for(let b=0;b<3;b++){ctx.strokeStyle=`rgba(${[107,164,249][b]},${[110,162,241][b]},${[175,207,251][b]},${[.25,.43,.78][b]*(1-close)})`;ctx.lineWidth=[.65,1,1.5][b]*dpr;ctx.stroke(paths[b])}ctx.fillStyle=`rgba(246,239,222,${.7*(1-close)})`;ctx.fill(cores);ctx.globalAlpha=.12*orbit*(1-close);ctx.drawImage(sprites.violet,W*.08,H*.02,W*.84,H*.96);ctx.globalAlpha=1;let center=1-smooth(46,48,time);glow(W*.5,H*.5,65+birth*40,'violet',(.27+.45*close)*center);for(let h of hands){glow(h.x,h.y,94,'gold',.8);ctx.fillStyle='rgba(255, function flower(){let count=0,xs,ys,size,phase,tier,ink;return {key:'flower',init(){let max=Math.min(62,Math.round(W*H/14500));xs=new Float32Array(max);ys=new Float32Array(max);size=new Float32Array(max);phase=new Float32Array(max);tier=new Uint8Array(max);ink=new Float32Array(max);count=0;for(let i=0;i<max;i++){let r=i<4?H*(.12+.04*rand(i,3)):H*(.019+.039*rand(i,3));for(let attempt=0;attempt<180;attempt++){let x=W*(.07+.86*rand(i*181+attempt,1)),y=H*(.09+.82*rand(i*181+attempt,2)),clear=true;for(let j=0;j<count;j++){if(Math.hypot(x-xs[j],y-ys[j])<(r+size[j])*.7){clear=false;break}}if(!clear)continue;xs[count]=x;ys[count]=y;size[count]=r;phase[count]=rand(i,4)*TAU;tier[count]=i<4?1:0;ink[count]=[2,3,5][i%3];count++;break}}},seek(){},step(dt,time,hands){clear();let bloom=smooth(13,26,time),fall=smooth(36,46,time),stain=fall*(1-smooth(44,48,time)),paths=[new Path2D(),new Path2D()],threads=new Path2D(),seeds=new Path2D();for(let i=0;i<count;i++){let x=xs[i],y=ys[i],light=0;for(let h of hands)light=Math.max(light,handPower(h,x,y,.16));let start=14+Math.hypot(x-W*.5,y-H*.5)/Math.hypot(W,H)*11,progress=clamp((time-start)/7+light*.75,0,1),vanish=clamp(fall*(1-light*.5),0,1);if(time<14){let a=.3+.65*(.5+.5*Math.sin(time*1.7+phase[i]));glow(x,y,10+size[i]*.12,'gold',a*.52);seeds.moveTo(x+1,y);seeds.arc(x,y,1.1,0,TAU);continue}if(progress<=0)continue;let R=size[i]*(1+light*.42),N=Math.floor(clamp(R*2.2,48,220)),n=Math.max(1,Math.floor(N*progress*(1-vanish*.72))),k=ink[i],range=k%2?Math.PI:TAU,path=paths[tier[i]];for(let j=0;j<=n;j++){let ang=j/N*range+phase[i],radius=R*Math.cos(k*j/N*range),xx=x+Math.cos(ang)*radius,yy=y+Math.sin(ang)*radius;if(j===0)path.moveTo(xx,yy);else path.lineTo(xx,yy)}if(fall>0){for(let j=0;j<3;j++){let a=phase[i]+j*2.4,xx=x+Math.cos(a)*R*.55,yy=y+Math.sin(a)*R*.55,drop=fall*H*(.10+.20*rand(i,j)),wind=(rand(i,j+20)-.5)*drop*.9+Math.sin(time*.7+phase[i])*drop*.25;threads.moveTo(xx,yy);threads.bezierCurveTo(xx+wind*.1,yy+drop*.2,xx+wind*.75,yy+drop*.65,xx+wind,yy+drop)}if(i%2===0)glow(x,y,R*2.5,'pink',stain*.6)}seeds.moveTo(x+1,y);seeds.arc(x,y,Math.min(1.7,1+R*.006),0,TAU)}ctx.strokeStyle=`rgba(192,91,123,${.42*(1-fall*.76)})`;ctx.lineWidth=.7*dpr;ctx.stroke(paths[0]);ctx.strokeStyle=`rgba(241,135,165,${.86*(1-fall*.76)})`;ctx.lineWidth=1.4*dpr;ctx.stroke(paths[1]);ctx.strokeStyle=`rgba(223,120,137,${.38*stain})`;ctx.lineWidth=.7*dpr;ctx.stroke(threads);ctx.fillStyle='rgba(243,204,143,.74)';ctx.fill(seeds);for(let h of hands)glow(h.x,h.y,125,'gold',.66)}}}
const works=[forest(),sea(),space(),flower()];function resize(){let rect=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);W=canvas.width;H=canvas.height;works.forEach(w=>w.init());works[workIndex].seek(t);render()}new ResizeObserver(resize).observe(stage);
function actOf(v){return v<14?0:v<36?1:2}function updateUI(){let m=meta[workIndex],act=actOf(t);document.getElementById('caption').textContent=m.name+'  /  '+String(act+1).padStart(2,'0')+'  /  '+Math.floor(t).toString().padStart(2,'0')+' : 48';document.getElementById('category').textContent=m.category;document.getElementById('title').textContent=m.name;document.getElementById('concept').textContent=m.concept;document.getElementById('meaning').textContent=m.meaning;document.getElementById('language').textContent=m.language;document.getElementById('ue').textContent='UE 계열: '+m.ue;document.getElementById('assets').textContent='필요한 외부 파일: '+m.assets;document.getElementById('story').innerHTML=m.acts.map((a,i)=>'<li class="'+(i===act?'now':'')+'">0'+(i+1)+' — '+a+'</li>').join('');document.getElementById('metrics').innerHTML=m.metrics.map(a=>'<div>'+a[0]+'<b>'+a[1]+'</b></div>').join('');document.querySelectorAll('#tabs button').forEach((b,i)=>b.classList.toggle('active',i===workIndex));document.querySelectorAll('#acts button').forEach((b,i)=>{b.classList.toggle('active',i===act);b.querySelector('i').style.width=(i<act?'100':i>act?'0':(t-[0,14,36][i])/[14,22,12][i]*100)+'%'});document.getElementById('play').textContent=playing?'Ⅱ':'▶'}
const tabs=document.getElementById('tabs'),acts=document.getElementById('acts');meta.forEach((m,i)=>{let b=document.createElement('button');b.textContent=m.name;b.onclick=()=>setWork(i,0);tabs.append(b)});for(let i=0;i<3;i++){let b=document.createElement('button');b.innerHTML='0'+(i+1)+' <span></span><i></i>';b.onclick=()=>seek([0,14,36][i]);acts.append(b)}function seek(at){t=clamp(at,0,48);last=performance.now();works[workIndex].init();works[workIndex].seek(t);updateUI();render()}function setWork(index,at=0){workIndex=(index+4)%4;seek(at)}document.getElementById('prev').onclick=()=>setWork(workIndex-1);document.getElementById('next').onclick=()=>setWork(workIndex+1);document.getElementById('play').onclick=()=>{playing=!playing;last=performance.now();updateUI()};document.addEventListener('keydown',e=>{if(e.target instanceof HTMLButtonElement)return;if(e.code==='Space'){e.preventDefault();playing=!playing;last=performance.now();updateUI()}else if(e.key==='ArrowLeft')setWork(workIndex-1);else if(e.key==='ArrowRight')setWork(workIndex+1);else if('123'.includes(e.key)&&e.key.length===1)seek([0,14,36][Number(e.key)-1])});
function pointer(e){let r=stage.getBoundingClientRect(),id='p'+e.pointerId,x=clamp((e.clientX-r.left)/r.width,0,1),y=clamp((e.clientY-r.top)/r.height,0,1),prev=realHands.get(id),now=performance.now(),speed=prev?Math.hypot((x-prev.x)*W,(y-prev.y)*H)/Math.max((now-prev.at)/1000,.008):0;realHands.set(id,{id,x,y,at:now,speed});lastReal=now}stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pointer(e)});stage.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)pointer(e)});for(let event of ['pointerup','pointercancel','pointerleave'])stage.addEventListener(event,e=>{if(e.pointerType!=='mouse'||event==='pointerleave')realHands.delete('p'+e.pointerId)});
function currentHands(dt){renderHands.length=0;let now=performance.now();for(let [id,h] of realHands){if(now-h.at>1800){realHands.delete(id);continue}let state=handStates.get(id)||{dwell:0,last:0,alternate:1};state.dwell+=dt;state.last=now;handStates.set(id,state);renderHands.push({id,x:h.x*W,y:h.y*H,speed:h.speed*Math.exp(-(now-h.at)/380),dwell:state.dwell})}if(renderHands.length===0&&now-lastReal>2000&&t>=14&&t<36){demoPhase=(demoPhase+dt)%10;let p=demoPhase,x,y,speed;if(p<4){x=.18+p*.11;y=.44+Math.sin(p*.8)*.08;speed=105}else if(p<6.7){x=.62;y=.44;speed=0}else{x=.62+(p-6.7)*.105;y=.44+Math.sin((p-6.7)*2)*.12;speed=760}renderHands.push({id:'demo',x:x*W,y:y*H,speed,dwell:p>4&&p<6.7?p-4:0,demo:true})}return renderHands}
function markers(hands){let layer=document.getElementById('hands');while(layer.children.length<hands.length){let el=document.createElement('div');el.className='hand';layer.append(el)}let r=stage.getBoundingClientRect();Array.from(layer.children).forEach((el,i)=>{let h=hands[i];el.style.display=h?'block':'none';if(h){el.style.left=h.x/W*r.width+'px';el.style.top=h.y/H*r.height+'px';el.innerHTML=h.demo?'<em>가상 손</em>':''}})}function render(dt=0){if(!canvas.width)return;ctx.setTransform(1,0,0,1,0,0);let hands=currentHands(dt);works[workIndex].step(dt,t,hands);markers(hands)}function frame(now){let elapsed=Math.max(0,(now-last)/1000);last=now;if(playing){t+=elapsed;while(t>=48){t-=48;workIndex=(workIndex+1)%4;works[workIndex].init();works[workIndex].seek(t)}}render(elapsed);updateUI();requestAnimationFrame(frame)}Object.defineProperty(window,'__proto',{configurable:true,value:{setWork:(i,at)=>setWork(clamp(Math.trunc(i),0,3),at),setPlaying:v=>{playing=!!v;last=performance.now();updateUI()},get t(){return t},get work(){return works[workIndex].key}}});updateUI();requestAnimationFrame(frame);
